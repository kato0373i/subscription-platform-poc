# CI（platform.md §10.2 の 3 つのジョブ。P-TST-7）
name: ci
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-unit:
    name: ① lint と UT
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod}
      - uses: actions/setup-node@v4
        with: {node-version: "24"}
      - run: npm i -g pnpm@9.15.9 && pnpm install --frozen-lockfile
      - name: 生成の差分チェック（errors.yaml・OpenAPI・messaging.yaml・schedules.yaml の検証を含む）
        run: |
          go run ./internal/tools/errcodesgen
          pnpm --filter @sp/api-client generate
          git diff --exit-code
      - uses: golangci/golangci-lint-action@v8
        with: {version: v2.14.0}
      - run: go run ./internal/tools/e2elint
      - run: go test ./...
      - run: pnpm -r typecheck

  integration:
    name: ② 結合テスト
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod}
      - run: go test -tags integration -p 4 ./...

  e2e:
    name: ③ E2E
    runs-on: ubuntu-latest
    env:
      CI: "true"
      SINK_TARGET_BASE: http://webhook-sink:8080
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod}
      - uses: actions/setup-node@v4
        with: {node-version: "24"}
      - run: npm i -g pnpm@9.15.9 && pnpm install --frozen-lockfile
      - name: ローカル環境（MiniStack・RDS・キュー・マイグレーション）
        run: go tool task up
      - name: 3 プロセス（devtools ビルドのコンテナ）
        run: go tool task dev:container
      - run: go tool task verify:ministack
      - run: go tool task verify:local
      - name: Playwright（parallel → clock）
        run: pnpm --filter @sp/e2e exec playwright test --project=parallel --project=clock
      - name: ログの添付の自己検査
        run: go tool task e2e:selftest
      - if: always()
        uses: actions/upload-artifact@v4
        with: {name: playwright-report, path: e2e/playwright-report}
      - if: always()
        uses: actions/upload-artifact@v4
        with: {name: local-logs, path: .local/logs}
      - if: failure()
        run: docker compose --profile app logs --no-color > .local/containers.log 2>&1 || true
      - if: failure()
        uses: actions/upload-artifact@v4
        with: {name: container-logs, path: .local/containers.log}
