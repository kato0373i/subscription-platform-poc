<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>お申し込み</title>
  <link rel="stylesheet" href="/checkout/checkout.css">
  <script src="/checkout/checkout.js" defer></script>
</head>
<body>
  <main>
    <h1 id="title">お申し込み</h1>
    <section id="plan" aria-live="polite">
      <p id="plan-name"></p>
      <p id="plan-price"></p>
      <p id="plan-trial"></p>
    </section>

    <!--
      カード番号・有効期限の入力欄は <form> の外に置き、name 属性を付けない（payments.md §7.10、NFR-007）。
      番号はブラウザの中でだけトークンに変換し、変換したら入力欄を空にする。サーバーにはトークンだけを送る。
    -->
    <section id="card">
      <label>カード番号
        <input id="card-number" type="text" inputmode="numeric" autocomplete="cc-number" placeholder="4242 4242 4242 4242" maxlength="23">
      </label>
      <label>有効期限（MM/YY）
        <input id="card-exp" type="text" inputmode="numeric" autocomplete="cc-exp" placeholder="12/28" maxlength="5">
      </label>
    </section>

    <section id="extra">
      <label>クーポンコード（任意）
        <input id="coupon" type="text" autocomplete="off" maxlength="64">
      </label>
    </section>

    <button id="submit" type="button" disabled>申し込む</button>
    <p id="result" role="status" data-status="idle"></p>
  </main>
</body>
</html>
