# エラーコードの正本（platform.md §7.2）。各 TL は自分の spec のコードをここに追記し、`task generate` で定数を生成する。
# code は snake_case、status は 4xx/5xx、owner はモジュール名。
codes:
  - code: validation_failed
    status: 400
    title: 入力の形式が正しくありません
    owner: platform
    description: OpenAPI の検証、ページング、必須ヘッダーの不足
  - code: unauthenticated
    status: 401
    title: 認証が必要です
    owner: platform
    description: トークン・API キーがない、不正、期限切れ
  - code: forbidden
    status: 403
    title: この操作は許可されていません
    owner: platform
    description: 主体の種類・ロールが合わない、テナントに所属していない
  - code: not_found
    status: 404
    title: 見つかりません
    owner: platform
    description: リソースがない、別テナントのリソース、未定義のルート
  - code: method_not_allowed
    status: 405
    title: このメソッドは使えません
    owner: platform
    description: ServeMux の 405 を Problem に変換したもの
  - code: conflict
    status: 409
    title: ほかの更新と競合しました
    owner: platform
    description: 楽観ロックの衝突
  - code: request_in_progress
    status: 409
    title: 同じリクエストを処理中です
    owner: platform
    description: 同じ Idempotency-Key のリクエストを処理している
  - code: idempotency_key_reused
    status: 422
    title: Idempotency-Key が別の内容で使われています
    owner: platform
    description: 同じキーで中身が違うリクエスト
  - code: internal_error
    status: 500
    title: 内部エラーが発生しました
    owner: platform
    description: 想定外のエラー
  - code: service_unavailable
    status: 503
    title: 一時的に利用できません
    owner: platform
    description: DB に接続できない、シャットダウン中
  - code: provider_unavailable
    status: 503
    title: 決済代行が一時的に利用できません
    owner: payments
    description: 決済代行の障害（サーキットブレーカーが開いている）。Retry-After を付ける（P-PAY-4）
  - code: clock_backward_not_allowed
    status: 422
    title: 業務時刻は戻せません
    owner: platform
    description: dev clock を現在より前にしようとした（devtools のみ）
  - code: tenant_not_active
    status: 403
    title: 事業者が有効ではありません
    owner: tenant
    description: 停止中の事業者のスタッフによる書き込み、販売できない事業者への操作
  - code: tenant_state_conflict
    status: 409
    title: 事業者の状態がこの操作を許しません
    owner: tenant
    description: 承認・停止で許されない状態遷移（identity.md §3.1）
  - code: fincode_shop_id_taken
    status: 409
    title: この fincode のショップ ID は使用されています
    owner: tenant
    description: 別の事業者が同じショップ ID で承認済み
  - code: staff_already_exists
    status: 409
    title: このスタッフは登録済みです
    owner: tenant
    description: 同じテナントに同じ subject または email のスタッフがいる
  - code: last_owner_required
    status: 409
    title: オーナーを 0 名にすることはできません
    owner: tenant
    description: 最後のオーナーの降格・削除
  - code: api_key_limit_exceeded
    status: 409
    title: 有効な API キーの上限に達しています
    owner: tenant
    description: 有効なキーは 10 本まで
  - code: account_withdrawn
    status: 403
    title: 退会済みのアカウントです
    owner: customer
    description: 退会した契約者のログイン（P-IDN-2）
  - code: email_unverified
    status: 403
    title: メールアドレスが確認されていません
    owner: customer
    description: email クレームがない、または email_verified = false
  - code: email_already_registered
    status: 409
    title: このメールアドレスは別のアカウントで登録済みです
    owner: customer
    description: 初回ログインで、email が他の有効なアカウントと重複（自動で紐づけない）
  - code: plan_unavailable
    status: 410
    title: 現在お申し込みいただけません
    owner: catalog
    description: プランが非公開、または事業者が有効でない（申込 API では 422 で返す。catalog.md §4）
  - code: price_unchanged
    status: 422
    title: 現在の価格と同じです
    owner: catalog
    description: 価格改定の金額が現在の価格と同じ（二重送信の防止）
  - code: coupon_code_taken
    status: 409
    title: このクーポンコードは使用されています
    owner: catalog
    description: 同じ事業者に同じコード（大文字に正規化）がある
  - code: coupon_not_found
    status: 422
    title: クーポンが見つかりません
    owner: catalog
    description: コードがない、または無効化されている
  - code: coupon_expired
    status: 422
    title: クーポンの有効期限が切れています
    owner: catalog
    description: now >= expires_at
  - code: coupon_not_applicable
    status: 422
    title: このプランには使えないクーポンです
    owner: catalog
    description: 対象プランの指定に含まれない
  - code: coupon_already_used
    status: 422
    title: このクーポンは使用済みです
    owner: catalog
    description: 同じ契約者が予約中・確定済み（1 人 1 回）
  - code: coupon_exhausted
    status: 422
    title: クーポンの利用上限に達しました
    owner: catalog
    description: 消費枠数（予約＋確定）が上限に達した
  - code: subscription_terminal
    status: 409
    title: この契約は終了しています
    owner: subscription
    description: 解約済み・申込不成立の契約への操作
  - code: subscription_state_conflict
    status: 409
    title: 現在の契約の状態ではこの操作はできません
    owner: subscription
    description: 申込処理中の解約予約、支払い遅延中のプラン変更など
  - code: cancellation_scheduled
    status: 409
    title: 解約が予約されています
    owner: subscription
    description: 解約予約中のプラン変更（先に解約予約を取り消す）
  - code: cancellation_not_revocable
    status: 409
    title: この解約予約は取り消せません
    owner: subscription
    description: 事業者の停止に伴う解約予約（D-01）
  - code: plan_change_not_allowed
    status: 422
    title: このプランには変更できません
    owner: subscription
    description: errors[].code に different_product / plan_unavailable / same_plan
  - code: trial_not_eligible
    status: 422
    title: このプランのトライアルは利用済みです
    owner: subscription
    description: 同じ商品のトライアルを使った契約者の申込（申込 API が返す。FR-014）
  - code: payment_method_limit_exceeded
    status: 422
    title: 登録できる支払方法の上限に達しています
    owner: payments
    description: 有効な支払方法は 1 人 10 件まで
  - code: invalid_payment_token
    status: 422
    title: カード情報を確認できませんでした
    owner: payments
    description: トークンの形式不正・使用済み・決済代行が拒否
  - code: unsupported_payment_method
    status: 422
    title: この支払方法は使えません
    owner: payments
    description: 手段と決済代行の組が有効でない
  - code: attempt_already_finalized
    status: 409
    title: この決済は確定済みです
    owner: payments
    description: 確定済みの試行を別の結果にしようとした
  - code: attempt_not_resolvable
    status: 409
    title: この決済はまだ手動で確定できません
    owner: payments
    description: 30 秒以内の処理中など
  - code: outcome_mismatch
    status: 409
    title: 決済代行の結果と指定が違います
    owner: payments
    description: 手動確定の指定が代行の照会結果と食い違う（force で上書きできる）
  - code: payable_already_paid
    status: 409
    title: この請求は支払い済みです
    owner: payments
    description: 成功した別の試行がある
  - code: invoice_not_collectible
    status: 409
    title: この請求は回収できません
    owner: billing
    description: 終端（paid / uncollectible / void）または caller_managed の請求に回収を要求した
  - code: collection_in_progress
    status: 409
    title: この請求は決済の結果待ちです
    owner: billing
    description: processing / payment_unknown の請求に回収を要求した（先に試行を確定させる）
  - code: payment_method_unavailable
    status: 422
    title: この支払方法は使えません
    owner: orchestration
    description: 本人のものでない・削除済みの支払方法で申込・変更した
  - code: payment_method_reentry_required
    status: 422
    title: 支払方法をもう一度登録してください
    owner: orchestration
    description: 事業者ショップ向けの参照を作れない（P-PAY-1）
  - code: payment_declined
    status: 422
    title: 決済できませんでした
    owner: orchestration
    description: 初回の決済が拒否された。decline_category（card_expired / insufficient_funds / generic）を付ける
  - code: subscription_not_modifiable
    status: 409
    title: この契約は変更できません
    owner: orchestration
    description: 終端（canceled / signup_failed）または申込の処理中の契約の支払方法を変えようとした
  - code: payment_method_in_use
    status: 409
    title: この支払方法は契約で使われています
    owner: orchestration
    description: 有効な契約（pending_initial を含む）で使用中の支払方法を削除しようとした
  - code: has_open_subscriptions
    status: 409
    title: 有効な契約があるため退会できません
    owner: orchestration
    description: 解約予約中を含む有効な契約がある（D-05）
  - code: billing_run_in_progress
    status: 409
    title: 同じ課金日の投入が実行中です
    owner: orchestration
    description: 同じ課金日の BillingRun が dispatching
