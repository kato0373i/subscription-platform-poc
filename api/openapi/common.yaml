# 全 audience 共通の部品（platform.md §7.1）
openapi: 3.0.3
info: {title: common, version: "1"}
paths: {}
components:
  schemas:
    Problem:
      type: object
      required: [type, title, status, code, request_id, correlation_id]
      properties:
        type: {type: string}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
        code: {type: string}
        request_id: {type: string}
        correlation_id: {type: string}
        errors:
          type: array
          items:
            type: object
            required: [field, code]
            properties:
              field: {type: string}
              code: {type: string}
  responses:
    Problem:
      description: エラー（application/problem+json）
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
