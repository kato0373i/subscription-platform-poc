# .local/logs/*.jsonl を MiniStack の CloudWatch Logs に送る（platform.md §8.6.4、ADR-009）。
# 正はファイル（task logs）。CloudWatch Logs は本番と同じ形のクエリを試すためのもの。
# cloudwatch_logs 出力は TLS を強制するので、TLS を終端する ministack-tls（nginx）を経由する。
[SERVICE]
    Flush        1
    Log_Level    warn
    Parsers_File /fluent-bit/etc/parsers.conf
    storage.path /fluent-bit/db/storage

[INPUT]
    Name             tail
    Path             /logs/*.jsonl
    Parser           json
    DB               /fluent-bit/db/tail.db
    Rotate_Wait      5
    Refresh_Interval 1
    Read_from_Head   On
    Skip_Long_Lines  On
    Buffer_Max_Size  1MB

[OUTPUT]
    Name               cloudwatch_logs
    Match              *
    region             ap-northeast-1
    endpoint           ministack-tls
    port               443
    tls.verify         Off
    log_group_name     /sp/local/unknown
    log_group_template /sp/local/$service
    log_stream_prefix  local-
    auto_create_group  Off
