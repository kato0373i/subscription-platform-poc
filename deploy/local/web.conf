# 画面の配信（business-console 設計 ADR-C06、consumer-mypage 設計 ADR-M04。ローカル・CI 専用）。
# /console/（事業者コンソール）・/mypage/（マイページ）は SPA（ビルド済みの dist）、/v1/・/checkout は api に渡す。同一オリジンにして CORS を使わない。
server {
  listen 8090;
  server_tokens off;
  client_max_body_size 1m;

  # ローカルの Cognito（MiniStack）は http://localhost:4566。本番では cognito-idp.<region>.amazonaws.com に置き換える（ADR-C07）
  set $csp "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' http://localhost:4566; frame-ancestors 'none'; base-uri 'none'; form-action 'self'; object-src 'none'";

  location = / { return 302 /console/; }
  location = /console { return 302 /console/; }

  location /console/assets/ {
    alias /usr/share/nginx/html/console/assets/;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options nosniff;
  }

  location = /console/config.json {
    alias /usr/share/nginx/html/console/config.json;
    add_header Cache-Control "no-store";
  }

  location /console/ {
    alias /usr/share/nginx/html/console/;
    try_files $uri /console/index.html;
    add_header Cache-Control "no-store";
    add_header Content-Security-Policy $csp always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
  }

  location /mypage/assets/ {
    alias /usr/share/nginx/html/mypage/assets/;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options nosniff;
  }

  location = /mypage/config.json {
    alias /usr/share/nginx/html/mypage/config.json;
    add_header Cache-Control "no-store";
  }

  location = /mypage { return 302 /mypage/; }

  location /mypage/ {
    alias /usr/share/nginx/html/mypage/;
    try_files $uri /mypage/index.html;
    add_header Cache-Control "no-store";
    add_header Content-Security-Policy $csp always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
  }

  location /v1/ {
    proxy_pass http://api:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  location /checkout {
    proxy_pass http://api:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}
