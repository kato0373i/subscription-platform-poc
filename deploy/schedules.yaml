# ジョブの定義（platform.md §8.2・§8.3）。schedule は EventBridge Scheduler の cron（Asia/Tokyo）。
# schedule がないジョブは手動実行（dev・ops）専用。devtools: true は devtools ビルドのワーカーだけが実行する。
jobs:
  - name: platform-idempotency-gc
    process: worker-billing
    schedule: "cron(0 3 * * ? *)"
    dedupe: daily
  - name: platform-outbox-gc
    process: worker-billing
    schedule: "cron(10 3 * * ? *)"
    dedupe: daily
  - name: platform-inbox-gc
    process: worker-billing
    schedule: "cron(20 3 * * ? *)"
    dedupe: daily
  - name: platform-job-cursor-gc
    process: worker-billing
    schedule: "cron(30 3 * * ? *)"
    dedupe: daily
  # 何もしないジョブ（tests/platform の dev のジョブ実行・ログの相関 ID の確認に使う）
  - name: platform-noop
    process: worker-billing
    dedupe: daily
    devtools: true
  # 放置されたクーポンの予約の解放（catalog.md §8）
  - name: catalog-coupon-reservation-sweep
    process: worker-billing
    schedule: "cron(5 * * * ? *)"
    dedupe: hourly
  # 回収時刻が来た請求の回収要求（billing.md §8。毎時 0 分 JST。10:00 JST に予定した請求は 10:00 の実行で拾う）
  - name: billing-collection-due
    process: worker-billing
    schedule: "cron(0 * * * ? *)"
    dedupe: hourly
  # 更新処理の投入（orchestration.md §4.2。毎日 00:30 JST）
  - name: orchestration-renewal-dispatch
    process: worker-billing
    schedule: "cron(30 0 * * ? *)"
    dedupe: daily
  # 止まったプロセス・サガの再開（§8。10 分ごと）
  - name: orchestration-process-sweeper
    process: worker-billing
    schedule: "cron(0/10 * * * ? *)"
    dedupe: none
  # 事業者の停止に伴う一括解約（§4.7。毎分）
  - name: orchestration-bulk-cancellation
    process: worker-billing
    schedule: "cron(* * * * ? *)"
    dedupe: none
  # 完了・中断したサガの削除（§8。毎日 03:30 JST、30 日超）
  - name: orchestration-checkout-saga-gc
    process: worker-billing
    schedule: "cron(30 3 * * ? *)"
    dedupe: daily
  # トライアル終了の予告（subscription.md §8。毎日 09:00 JST）
  - name: subscription-trial-will-end
    process: worker-billing
    schedule: "cron(0 9 * * ? *)"
    dedupe: daily
  # 一括シード（platform.md §7.3。devtools のみ。POST /v1/dev/seed/subscriptions が投入する）
  - name: platform-dev-seed-subscriptions
    process: worker-billing
    dedupe: none
    devtools: true
  # 結果不明の決済の照合（payments.md §8.1。PoC は 1 分ごと）
  - name: payments-resolve-unknown
    process: worker-billing
    schedule: "cron(* * * * ? *)"
    dedupe: none
  # 送り損ねた決済代行の通知の送り直し（§8.2）
  - name: payments-provider-events-sweep
    process: worker-billing
    schedule: "cron(* * * * ? *)"
    dedupe: none
  # 日次照合（§8.3。毎日 03:00 JST、前日分）
  - name: payments-reconcile-daily
    process: worker-billing
    schedule: "cron(0 3 * * ? *)"
    dedupe: daily
  # 期限の過ぎた前の署名鍵の消去（integration.md §8.5。毎日 04:00 JST）
  - name: integration-webhook-secret-cleanup
    process: worker-integration
    schedule: "cron(0 4 * * ? *)"
    dedupe: daily
