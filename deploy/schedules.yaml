# ジョブの定義（platform.md §8.2・§8.3）。schedule は EventBridge Scheduler の cron（Asia/Tokyo）。
# schedule がないジョブは手動実行（dev・ops）専用。devtools: true は devtools ビルドのワーカーだけが実行する。
jobs:
  - name: platform-idempotency-gc
    process: worker-billing
    schedule: "cron(0 3 * * ? *)"
    dedupe: daily
  - name: platform-outbox-gc
    process: worker-billing
    schedule: "cron(10 3 * * ? *)"
    dedupe: daily
  - name: platform-inbox-gc
    process: worker-billing
    schedule: "cron(20 3 * * ? *)"
    dedupe: daily
  - name: platform-job-cursor-gc
    process: worker-billing
    schedule: "cron(30 3 * * ? *)"
    dedupe: daily
  # 何もしないジョブ（tests/platform の dev のジョブ実行・ログの相関 ID の確認に使う）
  - name: platform-noop
    process: worker-billing
    dedupe: daily
    devtools: true
  # 放置されたクーポンの予約の解放（catalog.md §8）
  - name: catalog-coupon-reservation-sweep
    process: worker-billing
    schedule: "cron(5 * * * ? *)"
    dedupe: hourly
