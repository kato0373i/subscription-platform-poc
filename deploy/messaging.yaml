# 配線の正本（platform.md §8.1）。Terraform（infra/modules/messaging）と Go（messaging.LoadTopology）の両方が読む。
# 購読者ごとに 1 キュー。DLQ は "<name>-dlq" を自動で作る。events は detail-type の完全一致か "prefix:" だけ。
# 各ドメインの TL は、モジュールを実装するときに自分のキューをここに追記する（購読者が登録されていないキューがあるとプロセスは起動しない）。
bus: sp-events
queues:
  # 配線の確認用（task verify:local・tests/platform/smoke.spec.ts）。devtools の POST /v1/dev/smoke だけが発行する
  - name: platform-smoke
    process: worker-billing
    consumer: platform.smoke
    events: [platform.smoke_requested]
    concurrency: 1
    visibility_timeout_s: 30
    max_receive: 3
  # ジョブの起動（EventBridge Scheduler → プロセスごとの scheduler キュー。§8.3）
  - name: scheduler-billing
    process: worker-billing
    kind: scheduler
    concurrency: 2
    visibility_timeout_s: 300
    max_receive: 3
  - name: scheduler-integration
    process: worker-integration
    kind: scheduler
    concurrency: 2
    visibility_timeout_s: 300
    max_receive: 3
  # Orchestration（orchestration.md §5・§8）。回収の collection_due だけ専用のキュー（P-ARC-7）。
  # 「同じ契約に進行中のプロセスがある」ときは 60 秒後に再配信するので、max_receive は 10（P-IMP-17）
  - name: orc-events
    process: worker-billing
    consumer: orchestration.events
    events: [billing.invoice_paid, billing.invoice_payment_failed, billing.invoice_marked_uncollectible, subscription.payment_method_changed, subscription.canceled, tenant.suspended]
    concurrency: 10
    visibility_timeout_s: 60
    max_receive: 10
  # fincode への流量の上限 = concurrency × worker-billing のタスク数の上限（P-ARC-11 ②）
  - name: orc-collection
    process: worker-billing
    consumer: orchestration.collection
    events: [billing.invoice_collection_due]
    concurrency: 5
    visibility_timeout_s: 60
    max_receive: 10
  # 更新処理の投入（C-01。renewal-dispatch が SDK で直接送る）
  - name: orc-renewal.fifo
    process: worker-billing
    consumer: orchestration.renewal
    fifo: true
    concurrency: 10
    visibility_timeout_s: 60
    max_receive: 10
  # 決済の結果を請求に反映する（billing.md §5）
  - name: billing-payments
    process: worker-billing
    consumer: billing.payment_outcome
    events: [payments.payment_succeeded, payments.payment_failed, payments.payment_pending, payments.payment_outcome_unknown]
    concurrency: 5
    visibility_timeout_s: 60
    max_receive: 5
  # 退会に伴う支払方法の削除（payments.md §5.1）
  - name: payments
    process: worker-billing
    consumer: payments.customer_withdrawn
    events: [customer.withdrawn]
    concurrency: 2
    visibility_timeout_s: 60
    max_receive: 5
  # 決済代行の通知の処理（payments.md §8.2）。Webhook が Inbox に保存した後に直接送る（EventBridge を通さない）
  - name: payments-provider-events
    process: worker-billing
    consumer: payments.provider_events
    concurrency: 5
    visibility_timeout_s: 60
    max_receive: 5
  # 事業者 Webhook の外部イベントの作成（integration.md §5.2）。送信は worker-integration の配信ループが行う
  - name: integration-webhook
    process: worker-integration
    consumer: integration.webhook
    events: [subscription.started, subscription.trial_will_end, subscription.renewed, subscription.past_due, subscription.recovered,
      subscription.plan_change_scheduled, subscription.plan_change_revoked, subscription.plan_changed, subscription.cancellation_scheduled,
      subscription.cancellation_revoked, subscription.canceled, billing.invoice_paid, billing.invoice_payment_failed]
    concurrency: 10
    visibility_timeout_s: 60
    max_receive: 5
  # 契約者メール（§5.3）。SES の送信レートに合わせて同時実行は 5
  - name: integration-email
    process: worker-integration
    consumer: integration.email
    events: [subscription.started, subscription.trial_will_end, subscription.renewed, subscription.past_due, subscription.cancellation_scheduled,
      subscription.canceled, billing.invoice_issued, billing.invoice_payment_failed, customer.withdrawn, tenant.staff_added]
    concurrency: 5
    visibility_timeout_s: 60
    max_receive: 5
  # ダッシュボードの集計（console-dashboard 設計 §8）。集計の遅れ・失敗が課金・通知に影響しないよう専用のプロセス（ADR-R04）
  - name: reporting-projection
    process: worker-projection
    consumer: reporting.projection
    events: [subscription.started, subscription.renewed, subscription.recovered, subscription.plan_changed, subscription.past_due,
      subscription.canceled, billing.invoice_paid]
    concurrency: 10
    visibility_timeout_s: 60
    max_receive: 5
